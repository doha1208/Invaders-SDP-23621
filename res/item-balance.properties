# Item System (Team CS) balance values.
# Edit and save, then start a new game run. No Java compilation is required.
# Override location: java -Dinvaders.itemBalance=<path> ...
# A missing key uses the built-in default shown here. An invalid value stops the game with an error.

# --- Item effects ---
# Durations: milliseconds (> 0). Charges: positive integer. Multipliers: > 0.
shield.durationMillis=10000
shield.charges=1
rapidFire.multiplier=1.5
bulletSpeed.multiplier=1.10
freeze.durationMillis=5000

# --- Life item ---
# Lives cannot go above maxLives through the life item (>= 1).
# At the cap the life item awards capBonusScore points instead (>= 0).
life.maxLives=5
life.capBonusScore=500

# --- Drops ---
# Probability per kill, inclusive range 0..1.
drop.regular.probability=0.15
drop.special.probability=1.0
# Relative selection weights after a successful drop roll (>= 0); 0 disables a kind.
# At least one must be positive if either drop probability is positive.
drop.weight.life=1
drop.weight.shield=1
drop.weight.rapidFire=1
drop.weight.bulletSpeed=1
drop.weight.freeze=1
# Fall speed in pixels/second, drop size in pixels, time on the ground in milliseconds (all > 0).
drop.fallSpeed=80
drop.width=24
drop.height=24
drop.groundLifetimeMillis=8000

# --- Inventory ---
# Number of slots for stored (manual) items, positive integer.
inventory.capacity=3
