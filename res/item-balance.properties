# Edit and save, then start a new game run. No Java compilation is required.
# Keep this file external when distributing a JAR.
# Override location: java -Dinvaders.itemBalance=<path> ...
# Durations: milliseconds (> 0). Charges: positive integer. Multipliers: > 0.
shield.durationMillis=10000
shield.charges=1
rapidFire.multiplier=1.5
bulletSpeed.multiplier=1.10
freeze.durationMillis=5000

# Probability per confirmed kill, inclusive range 0..1.
drop.regular.probability=0.15
drop.special.probability=1.0
# Relative selection weights after a successful drop roll; 0 disables a kind.
# At least one must be positive if either drop probability is positive.
drop.weight.life=1
drop.weight.shield=1
drop.weight.rapidFire=1
drop.weight.bulletSpeed=1
drop.weight.freeze=1

# Positive pixels/second, pixel dimensions, and milliseconds after landing.
drop.fallSpeed=80
drop.width=24
drop.height=24
drop.groundLifetimeMillis=8000
# Positive integer. Explicit ItemAPI(capacity, random) overrides this default.
inventory.capacity=3
